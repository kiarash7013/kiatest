<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    
	<div class="bg-white p-8   container ">
    	
    	<h2 id="status-text" class="text-xl font-bold text-center text-gray-800 mb-6">ثبت سفارش</h2>
 
    	<div class="relative flex justify-between items-center mb-8">
 	       <div class="absolute w-full h-1 bg-gray-200 top-1/2 -translate-y-1/2 -z-10"></div>
        	<div id="progress" class="absolute w-0 h-1 bg-green-500 top-1/2 -translate-y-1/2 -z-10 transition-all "></div>
 
        	<div class="step w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-blue-500 text-white animate-pulse">1</div>
        	<div class="step w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-gray-200 text-gray-500">2</div>
            <div class="step w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-gray-200 text-gray-500">3</div>
        	<div class="step w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold bg-gray-200 text-gray-500">4</div>
    	</div>
 
    	<button id="nextBtn" class="w-full bg-blue-600 hover:bg-blue-800 text-white py-2 rounded-lg font-medium transition">
        	مرحله‌ی بعد
    	</button>
    	
	</div>



  </body>
</html>
